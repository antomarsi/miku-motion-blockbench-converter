[project]
name = "miku-motion-converter"
version = "0.1.0.dev0"
description = "Convert MikuMikuDance motion (.vmd) into Blockbench / GeckoLib animation JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "antomarsi" }]
keywords = ["mmd", "vmd", "geckolib", "blockbench", "animation", "retargeting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
miku-motion = "miku_motion.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pypmxvmd>=2.7.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miku_motion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY", "PT"]
# RUF001-003: MMD bone names in tests/fixtures legitimately use full-width characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "real_assets: needs the git-ignored assets/ folder (skipped when absent)",
]
